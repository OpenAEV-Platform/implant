name: "CI Pipeline"

# ════════════════════════════════════════════════════════════════════
# Single reusable workflow for the whole CI pipeline, called by
# implant-ci.yml. A scheduled workflow can call it the same way.
# ════════════════════════════════════════════════════════════════════

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Quality gates (fmt + audit).
  #
  # Single-platform fast checks. Clippy lives in its own job because
  # it needs to run per OS target to catch cfg-gated code.
  # ──────────────────────────────────────────────────────────────────
  quality:
    name: "🔍 Quality gates (fmt + audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/quality

  # ──────────────────────────────────────────────────────────────────
  # Clippy lint per-OS. Per-OS (not per-arch) is required because the
  # implant has cfg(target_os=...) code paths the lint must validate
  # on each platform. The cfg gates are arch-independent so one target
  # per OS is sufficient.
  # ──────────────────────────────────────────────────────────────────
  clippy:
    name: "🧹 Clippy (${{ matrix.os }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos
            runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/clippy
        with:
          os: ${{ matrix.os }}
          target: ${{ matrix.target }}

  # ──────────────────────────────────────────────────────────────────
  # Run the test suite on every (os, arch) target. This is the
  # cross-platform correctness gate; `coverage` measures line coverage
  # on Linux only.
  # ──────────────────────────────────────────────────────────────────
  tests:
    name: "🧪 Tests (${{ matrix.os }}-${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/tests
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}

  # ──────────────────────────────────────────────────────────────────
  # Code coverage (Linux/x86_64 only). cargo-llvm-cov re-runs the
  # test suite with LLVM source-based instrumentation to produce
  # lcov.info, which is uploaded to Codecov. The `tests` job above
  # is the cross-platform correctness gate; this job's role is
  # coverage measurement.
  # ──────────────────────────────────────────────────────────────────
  coverage:
    name: "📊 Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/coverage
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # Build the implant for every (os, arch) target, then stage
  # artifacts for downstream promotion.
  # ──────────────────────────────────────────────────────────────────
  build:
    name: "🔨 Build (${{ matrix.os }}-${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            jfrog_path: linux/x86_64
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            jfrog_path: linux/arm64
          - os: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            jfrog_path: windows/x86_64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            jfrog_path: windows/arm64
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            jfrog_path: macos/x86_64
          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            jfrog_path: macos/arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/build
        with:
          arch: ${{ matrix.arch }}
          jfrog_path: ${{ matrix.jfrog_path }}
          os: ${{ matrix.os }}
          target: ${{ matrix.target }}

  # ──────────────────────────────────────────────────────────────────
  # Smoke-test the release binaries on every supported OS version,
  # including ones the build does not run on. A mock platform serves
  # a command payload; the implant must run it with each native
  # executor and report its output back.
  # ──────────────────────────────────────────────────────────────────
  smoke:
    name: "💨 Smoke (${{ matrix.runner }})"
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: ubuntu-x86_64
            bin: linux/x86_64/openaev-implant
          - runner: ubuntu-26.04
            artifact: ubuntu-x86_64
            bin: linux/x86_64/openaev-implant
          - runner: ubuntu-22.04-arm
            artifact: ubuntu-arm64
            bin: linux/arm64/openaev-implant
          - runner: ubuntu-26.04-arm
            artifact: ubuntu-arm64
            bin: linux/arm64/openaev-implant
          - runner: windows-2022
            artifact: windows-x86_64
            bin: windows/x86_64/openaev-implant.exe
          - runner: windows-2025
            artifact: windows-x86_64
            bin: windows/x86_64/openaev-implant.exe
          - runner: windows-11-arm
            artifact: windows-arm64
            bin: windows/arm64/openaev-implant.exe
          - runner: macos-15
            artifact: macos-arm64
            bin: macos/arm64/openaev-implant
          - runner: macos-26
            artifact: macos-arm64
            bin: macos/arm64/openaev-implant
          - runner: macos-15-intel
            artifact: macos-x86_64
            bin: macos/x86_64/openaev-implant
          - runner: macos-26-intel
            artifact: macos-x86_64
            bin: macos/x86_64/openaev-implant
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/smoke
        with:
          artifact: ${{ matrix.artifact }}
          bin: ${{ matrix.bin }}

  # ──────────────────────────────────────────────────────────────────
  # The OS trust store is consulted for HTTPS: a private CA trusted by
  # the OS must be accepted by the client (ignored test, run here).
  # ──────────────────────────────────────────────────────────────────
  os-trust-store:
    name: "🔐 OS trust store (${{ matrix.os }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/os-trust-store
        with:
          os: ${{ matrix.os }}

  # ──────────────────────────────────────────────────────────────────
  # Pipeline gate
  #
  # Required branch-protection check: "<caller-job> / ✅ Pipeline Gate".
  # Fails when any job above failed or was cancelled.
  # ──────────────────────────────────────────────────────────────────
  pipeline-gate:
    name: "✅ Pipeline Gate"
    needs:
      - quality
      - clippy
      - tests
      - coverage
      - build
      - smoke
      - os-trust-store
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          FAILED=0
          TOTAL=0

          echo "══════════════════════════════════════════════════"
          echo "  ✅ Upstream Job Results"
          echo "══════════════════════════════════════════════════"
          echo ""

          for job in $(echo "$NEEDS_JSON" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            TOTAL=$((TOTAL + 1))

            case "$result" in
              success)   icon="✅" ;;
              skipped)   icon="⏭️" ;;
              failure|cancelled) icon="❌"; FAILED=$((FAILED + 1)) ;;
              *)         icon="❓" ;;
            esac

            printf "  %s  %-30s %s\n" "$icon" "$job" "$result"
          done

          echo ""
          echo "══════════════════════════════════════════════════"

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ $FAILED/$TOTAL upstream job(s) failed"
            exit 1
          fi

          echo "✅ All $TOTAL upstream jobs passed"
